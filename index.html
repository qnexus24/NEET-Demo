const WI={phy:'Ph',che:'Ch',bio:'Bi',emp:'Em',eth:'Et',neu:'Ne',cog:'Co'};
const TQ=R.reduce((a,r)=>a+QS[r.id].length,0);
const AVSVG='<svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="#bff3ff"/><path d="M4 40q2-14 16-14t16 14z" fill="#fff"/><path d="M15 28l5 8 5-8z" fill="#16c3a8"/><circle cx="20" cy="18" r="9" fill="#f2c4a0"/><path d="M10 16a10 10 0 0 1 20 0z" fill="#16c3a8"/><rect x="9" y="15" width="22" height="3.5" rx="1.7" fill="#0fa58d"/><circle cx="16.5" cy="20" r="1.2" fill="#2a1f3d"/><circle cx="23.5" cy="20" r="1.2" fill="#2a1f3d"/></svg>';
const ATT=[];let PF=null,cur='login',retTo='mapScreen',tEnd=0,tStart=0,submitted=false,RES=null;
const fmtT=ms=>{const t=Math.max(0,Math.round(ms/1000));return String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const attended=()=>R.reduce((a,r)=>a+ST[r.id].filter(s=>s.sel!==null).length,0);
const marked=()=>R.reduce((a,r)=>a+ST[r.id].filter(s=>s.flag).length,0);

function startShift(){if(tEnd)return;tStart=Date.now();tEnd=tStart+SHIFT*1000;tick()}
function tick(){if(!tEnd||submitted)return;const l=tEnd-Date.now();if(l<=0){doSubmit(true);return}
 const tt=fmtT(l);['tm','qTm'].forEach(id=>{const e=Q(id);e.textContent=tt;const c=e.parentElement;c.classList.toggle('amber',l<=300000&&l>60000);c.classList.toggle('red',l<=60000)})}
setInterval(tick,1000);

function hudSync(){const i=rankIdx(xp),nx=RANKS[i+1],pct=nx?Math.round((xp-RANKS[i][1])/(nx[1]-RANKS[i][1])*100):100;
 Q('hLv').textContent=i+1;Q('hRank').textContent=RANKS[i][0];Q('hLvl').textContent=nx?(nx[1]-xp)+' XP to '+nx[0]:'Top rank reached';
 Q('hBar').style.width=pct+'%';Q('hXp').textContent=xp+' XP';
 if(PF){Q('pName').textContent=DN;Q('pRank').textContent=RANKS[i][0]}
 const n=attended();Q('sbCnt').textContent=n+' / '+TQ;Q('sbFill').style.width=(n/TQ*100)+'%'}

/* Scoring. In production, correct answers must NEVER be shipped to the browser: move this to the server. */
function scoreAttempt(sel){const o={wards:{},total:0,max:0,correct:0,wrong:0,skip:0};
 R.forEach(r=>{let c=0,w=0,k=0,pts=0;QS[r.id].forEach((q,i)=>{const v=sel[r.id][i];o.max+=SCORE.plus;
  if(v===null||v===undefined){k++;return}
  if(v===q.a){c++;pts+=SCORE.plus}else{w++;if(SCORE.acad.includes(r.id))pts-=SCORE.minus}});
  o.wards[r.id]={c,w,k,pts,n:QS[r.id].length};o.total+=pts;o.correct+=c;o.wrong+=w;o.skip+=k});return o}

/* ----- submit ----- */
function openConfirm(){if(submitted||!tEnd)return;const n=attended(),m=marked(),w=TQ-n;
 Q('sBody').innerHTML=`<div class="sg"><div><b>${n}</b><span>Attended</span></div><div><b>${w}</b><span>Not attended</span></div><div><b>${m}</b><span>Marked for review</span></div></div>${w?`<div class="warn">${w} patient${w>1?'s are':' is'} still waiting. Patients you skip score zero.</div>`:''}<div class="swl">${R.map(r=>{const d=ST[r.id].filter(s=>s.sel!==null).length;return `<div><i style="background:${r.c}"></i><span>${r.n}</span><b>${d}/${QS[r.id].length}</b></div>`}).join('')}</div><p class="lead" style="margin:12px 0 0">Time left <b>${fmtT(tEnd-Date.now())}</b>. You can retake the test after submitting. Every attempt is saved in your profile.</p>`;
 Q('sOvl').hidden=false;Q('sKeep').focus()}
function closeConfirm(){Q('sOvl').hidden=true;if(!Q('mapScreen').hidden)Q('mSubmit').focus()}
Q('mSubmit').onclick=openConfirm;Q('sKeep').onclick=closeConfirm;Q('sGo').onclick=()=>doSubmit(false);
document.addEventListener('keydown',e=>{if(Q('sOvl').hidden)return;if(e.key==='Escape'){closeConfirm();return}
 if(e.key==='Tab'){const f=[Q('sKeep'),Q('sGo')],i=f.indexOf(document.activeElement);e.preventDefault();f[(i+(e.shiftKey?-1:1)+2)%2].focus()}});
function doSubmit(auto){if(submitted||!tEnd)return;submitted=true;
 const sel={};R.forEach(r=>sel[r.id]=ST[r.id].map(s=>s.sel));
 RES=scoreAttempt(sel);RES.xp=xp;RES.time=Math.min(SHIFT*1000,Date.now()-tStart);RES.auto=!!auto;RES.n=ATT.length+1;ATT.push({n:RES.n,total:RES.total,max:RES.max,pct:Math.round(Math.max(0,RES.total)/RES.max*100),xp:xp,c:RES.correct,w:RES.wrong,k:RES.skip});
 Q('sOvl').hidden=true;showResult()}

/* ----- result screen ----- */
function countUp(el,to,ms,f){if(rm||!to){el.textContent=f(to);return}const t0=performance.now();
 const st=n=>{const k=Math.min(1,(n-t0)/ms);el.textContent=f(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}
const badgeSvg=r=>`<div class="bdg"><svg viewBox="0 0 48 54" aria-hidden="true"><path d="M24 2l20 12v26L24 52 4 40V14z" fill="${r.c}" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M24 2l20 12v26L24 52 4 40V14z" fill="none" stroke="${r.e}" stroke-width="1.5" stroke-linejoin="round" opacity=".6"/><text x="24" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#10324a" style="font-family:'Chakra Petch',sans-serif">${WI[r.id]}</text></svg><span>${r.n}</span></div>`;
function showResult(){const r=RES,pct=Math.max(0,r.total)/r.max,att=r.correct+r.wrong,acc=att?Math.round(r.correct/att*100):0,ri=rankIdx(r.xp),C=+(2*Math.PI*68).toFixed(2);
 const vd=pct>=.8?['Outstanding shift','You handled almost every case with confidence.']:pct>=.6?['Strong shift','Solid work across most wards.']:pct>=.4?['Good effort','You have a base to build on. The focus list below shows where to start.']:['Keep practising','Every shift teaches something. Start with the focus list below.'];
 const ws=R.map(x=>Object.assign({r:x},r.wards[x.id])),mx=Math.max(...ws.map(w=>w.c));
 const strong=mx>0?ws.filter(w=>w.c===mx):[],weak=ws.filter(w=>w.c<w.n).sort((a,b)=>a.c/a.n-b.c/b.n||a.pts-b.pts).slice(0,3);
 const full=R.filter(x=>r.wards[x.id].k===0);
 const tiles=[['Correct',r.correct,'#2fb52c'],['Wrong',r.wrong,'#d6336c'],['Skipped',r.skip,'#e59a12'],['Accuracy',acc+'%','#1668d8']].map((t,i)=>`<div class="tile" style="--tc:${t[2]};animation-delay:${.15+i*.07}s"><b>${t[1]}</b><span>${t[0].toUpperCase()}</span></div>`).join('');
 const rows=ws.map(w=>`<div class="wr"><div class="wb" style="background:linear-gradient(180deg,${w.r.c},${w.r.e})"><b>${w.c}</b><small>/${w.n}</small></div><div><div class="wn">${w.r.n}</div><div class="ws">${w.r.a} ${w.r.b}</div><div class="wt"><i style="width:${w.c/w.n*100}%;background:linear-gradient(90deg,${w.r.c},${w.r.e})"></i></div><div class="wf">${w.pts} pts${w.k?' · '+w.k+' skipped':''}</div></div><div class="stars" role="img" aria-label="${w.c} of ${w.n} stars">${stars(w.c,w.n)}</div></div>`).join('');
 const li=(w,sub)=>`<div class="li"><i style="background:${w.r.c}"></i><div><b>${w.r.n}</b><span>${sub}</span></div><em>${w.c}/${w.n}</em></div>`;
 const tips=[weak.length?`Spend your next two study sessions on <b>${weak[0].r.a} ${weak[0].r.b}</b>.`:'No weak ward this time. Keep a weekly revision slot to stay sharp.','Review each mistake, then retry similar questions a day later.','Short, regular revision beats late-night cramming.'];
 Q('resScreen').innerHTML=`<div class="phd"><span class="lg"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="#fff"/></svg></span><b>CORTEX HOSPITAL</b></div>
<div class="rc hero2"><div class="ring"><svg viewBox="0 0 160 160" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc21a"/><stop offset="1" stop-color="#2fc04a"/></linearGradient></defs><circle class="tr" cx="80" cy="80" r="68" fill="none" stroke-width="16"/><circle id="rArc" class="pg2" cx="80" cy="80" r="68" fill="none" stroke-width="16" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="mid"><b id="rPct">0%</b><span>SCORE</span></div></div>
<div class="hr"><div class="kick">DUTY OVER · ${esc(DN).toUpperCase()} · ATTEMPT ${r.n}</div><h1>${vd[0]}</h1><p>${vd[1]}</p><div class="sc"><b id="rScore">0</b><span>/ ${r.max} points</span></div><div class="chips"><span class="chp"><svg><use href="#coin"/></svg>${r.xp} XP</span><span class="chp">Rank <b>${RANKS[ri][0]}</b></span><span class="chp"><svg><use href="#clk"/></svg>${fmtT(r.time)}</span></div>${r.auto?'<p class="note">Time ran out, so your shift was submitted automatically.</p>':''}</div></div>
<div class="tiles">${tiles}</div>
<div class="rc"><h2>WARD PERFORMANCE</h2><div class="wg">${rows}</div></div>
<div class="ins"><div class="rc"><h2>STRONGEST WARDS</h2>${strong.length?strong.map(w=>li(w,w.r.a+' '+w.r.b)).join(''):'<p class="mute">Nothing stood out yet. Use the focus list to start.</p>'}</div>
<div class="rc"><h2>FOCUS NEXT</h2>${weak.length?weak.map(w=>li(w,'Revise: '+w.r.a+' '+w.r.b)).join(''):'<p class="mute">No weak spots. Keep revising regularly.</p>'}</div></div>
<div class="rc"><h2>BADGES EARNED · ${full.length} / ${R.length}</h2><div class="bdgs">${full.length?full.map(badgeSvg).join(''):'<p class="mute">Attend every patient in a ward to earn its badge.</p>'}</div></div>
<div class="rc"><h2>STUDY TIPS</h2><ul class="tips">${tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>
<div class="acts"><button class="btn fin" id="rAgain" type="button">ATTEMPT AGAIN</button><button class="btn" id="rProf" type="button">VIEW MY PROFILE</button></div>`;
 Q('rProf').onclick=openProfile;Q('rAgain').onclick=newAttempt;show('resScreen');
 requestAnimationFrame(()=>setTimeout(()=>{const a=Q('rArc');if(a)a.style.strokeDashoffset=C*(1-pct)},80));
 countUp(Q('rPct'),Math.round(pct*100),1400,n=>n+'%');countUp(Q('rScore'),r.total,1400,n=>n)}

/* ----- profile screen ----- */
function buildProfile(){const i=rankIdx(xp),nx=RANKS[i+1],pct=nx?Math.round((xp-RANKS[i][1])/(nx[1]-RANKS[i][1])*100):100;
 const done=R.filter(r=>ST[r.id].every(s=>s.sel!==null));
 const st=submitted?`<h2>SHIFT RESULT</h2><p class="big2">${RES.total} <small>/ ${RES.max} points</small></p><p class="mute">${RES.correct} correct · ${RES.wrong} wrong · ${RES.skip} skipped</p><div class="acts" style="justify-content:flex-start"><button class="btn fin" id="pAgain" type="button" style="min-width:0">ATTEMPT AGAIN</button><button class="btn" id="pRes" type="button" style="min-width:0">VIEW RESULT</button></div>`
  :`<h2>SHIFT IN PROGRESS</h2><p class="big2">${attended()} <small>/ ${TQ} patients attended</small></p><p class="mute">Time left <b>${fmtT(tEnd-Date.now())}</b></p><div class="acts" style="justify-content:flex-start"><button class="btn" id="pBack2" type="button" style="min-width:0">BACK TO TEST</button></div>`;
 Q('profScreen').innerHTML=`<div class="phd"><button class="gb" id="pBack" type="button">◀ BACK</button><b>MY PROFILE</b></div>
<div class="rc pf"><span class="pbig">${AVSVG}</span><div><h1>${esc(DN)}</h1><p class="sub">${esc(PF.name)}</p><dl class="dl"><dt>EMAIL</dt><dd>${esc(PF.email)}</dd><dt>PHONE</dt><dd>+91 ${esc(PF.phone)}</dd><dt>SCHOOL</dt><dd>${esc(PF.school)}</dd></dl></div></div>
<div class="pgrid"><div class="rc"><h2>RANK</h2><p class="big2" style="font-size:30px">${RANKS[i][0]}</p><div class="bar"><i style="width:${pct}%"></i></div><p class="mute">${xp} XP${nx?' · '+(nx[1]-xp)+' XP to '+nx[0]:' · top rank reached'}</p></div><div class="rc">${st}</div></div>
${ATT.length?`<div class="rc"><h2>MY ATTEMPTS · ${ATT.length}</h2>${ATT.map(a=>{const best=a.pct===Math.max(...ATT.map(x=>x.pct))&&ATT.length>1;return `<div class="li"><i style="background:${best?'#2fb52c':'#12a3a8'}"></i><div><b>Attempt ${a.n}${best?' · Best':''}</b><span>${a.c} correct · ${a.w} wrong · ${a.k} skipped · ${a.xp} XP</span></div><em>${a.total}/${a.max} · ${a.pct}%</em></div>`}).join('')}</div>`:''}<div class="rc"><h2>BADGES · ${done.length} / ${R.length}</h2><div class="bdgs">${done.length?done.map(badgeSvg).join(''):'<p class="mute">Attend every patient in a ward to earn its badge.</p>'}</div></div>`;
 Q('pBack').onclick=()=>show(retTo);
 const a=Q('pRes');if(a)a.onclick=()=>show('resScreen');const ag=Q('pAgain');if(ag)ag.onclick=newAttempt;const b=Q('pBack2');if(b)b.onclick=()=>show(retTo)}
function openProfile(){if(!PF)return;if(cur==='profScreen'){show(retTo);return}retTo=cur;buildProfile();show('profScreen')}
Q('profBtn').onclick=openProfile;
function introPanel(){$('#pn').innerHTML=`<div class="pic" style="background:linear-gradient(180deg,#ffe28a,#e59a12)"><svg width="26" height="26" viewBox="0 0 24 24">${STAR} fill="#fff" stroke="#b36b00" stroke-width="1.6" stroke-linejoin="round"/></svg></div><div class="pg"><div class="t">Choose a ward</div><div class="s">Tap any room and ${esc(DN)} walks there from the entrance.</div></div>`}
function newAttempt(){
 R.forEach(r=>{r.d=0;ST[r.id]=QS[r.id].map(()=>({sel:null,flag:false}))});
 xp=0;combo=1;pre=null;wid='phy';ci=0;busy=false;submitted=false;RES=null;tEnd=0;tStart=0;retTo='mapScreen';
 ++tok;at=E;pos={x:E.cx,y:E.fy};arrived=true;
 $('#lay').innerHTML=`<g id="dr" transform="translate(${pos.x} ${pos.y})">${DOC}</g>`;
 Q('sOvl').hidden=true;
 ['tm','qTm'].forEach(id=>{const e=Q(id);e.textContent=fmtT(SHIFT*1000);e.parentElement.classList.remove('amber','red')});
 startShift();drawMap();introPanel();show('mapScreen')}
drawMap();
</script></body></html>
